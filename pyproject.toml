[project]
name = "cs2-digest"
version = "0.1.0"
description = "Daily Airflow job that transcribes and summarizes CS2 YouTube videos."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a real ClickHouse (docker compose up -d); skipped by default",
]
